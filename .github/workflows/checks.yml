name: Source checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npx tsc --noEmit
      - run: npm run docs:check
      - run: npm run i18n:check
      - name: Build each declared public source profile
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { resolveDemoBuildProfile } from './scripts/demo-build-profiles.mjs';

          const packageName = JSON.parse(readFileSync('package.json', 'utf8')).name;
          const variantsByPackage = {
            'pip-demo-replica': ['replica'],
            'pip-demo': ['neutral-plus', 'pip', 'pip-plus'],
          };
          const variants = variantsByPackage[packageName];
          if (!variants) {
            throw new Error(`Unknown public Demo package name: ${packageName}`);
          }

          for (const variant of variants) {
            const profile = resolveDemoBuildProfile(variant);
            console.log(`Building expected variant=${variant} appId=${profile.appId}`);
            const result = spawnSync(
              'npx',
              ['--no-install', 'vite', 'build'],
              {
                env: {
                  ...process.env,
                  NO_ELECTRON: '1',
                  VITE_DEMO_PRODUCT: profile.product,
                  VITE_DEMO_APPEARANCE: profile.appearance,
                  VITE_DEMO_EXTRAS: profile.extras,
                },
                stdio: 'inherit',
              },
            );
            if (result.error) throw result.error;
            if (result.signal) {
              throw new Error(`Vite build for ${variant} terminated by ${result.signal}`);
            }
            if (result.status !== 0) {
              throw new Error(`Vite build for ${variant} exited with ${result.status}`);
            }
          }
          NODE
